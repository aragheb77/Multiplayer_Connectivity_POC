name: Build Android POC APKs

on:
  push:
    branches: [main]
    paths:
      - "LocalMultiplayerPOC_repo_payload.tar.gz"
      - ".github/workflows/build-apks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract reviewed source payload
        run: tar -xzf LocalMultiplayerPOC_repo_payload.tar.gz

      - name: Build both sample APKs
        working-directory: LocalMultiplayerPOC
        run: gradle --no-daemon assembleDebug

      - name: Verify APK outputs exist
        shell: bash
        run: |
          set -euo pipefail
          find LocalMultiplayerPOC -path '*/build/outputs/apk/debug/*.apk' -type f -print
          test -n "$(find LocalMultiplayerPOC -path '*/build/outputs/apk/debug/*.apk' -type f -print -quit)"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: Multiplayer-Connectivity-POC-debug-APKs
          path: |
            LocalMultiplayerPOC/sample-app/build/outputs/apk/debug/*.apk
            LocalMultiplayerPOC/sample-app-two/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
