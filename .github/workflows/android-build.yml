name: Android POC build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build both sample apps
        run: gradle --no-daemon --stacktrace --warning-mode all :sample-app:assembleDebug :sample-app-two:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: local-multiplayer-poc-debug-apks
          retention-days: 14
          path: |
            sample-app/build/outputs/apk/debug/*.apk
            sample-app-two/build/outputs/apk/debug/*.apk
